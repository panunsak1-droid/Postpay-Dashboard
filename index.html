.wrap{max-width:1280px;margin:0 auto;padding:16px}

.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--mut);padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--mut);font-size:12px}.kpi .v{font-size:26px;font-weight:700;line-height:1.2}.kpi .s{font-size:12px;color:var(--mut)}
.kpi.hero{border-color:var(--acc)}.kpi.hero .v{color:var(--acc)}
.pb{height:6px;background:var(--bar2);border-radius:3px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--bar)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tabs .seg button{padding:6px 12px}
.sc{overflow-x:auto;max-height:520px;overflow-y:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
tr.tot td{font-weight:700;background:var(--bg)}
.pill{display:inline-block;min-width:58px;text-align:center;border-radius:12px;padding:1px 8px;font-weight:600}
.g{background:var(--okb);color:var(--ok)}.a{background:var(--warnb);color:var(--warn)}.r{background:var(--badb);color:var(--bad)}
.mini{display:inline-block;width:70px;height:6px;background:var(--bar2);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}.mini i{display:block;height:100%;background:var(--bar)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid section{margin:0}
.note{color:var(--mut);font-size:12px;margin:8px 0 0}
.up{color:var(--ok)}.dn{color:var(--bad)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}

const $=s=>document.querySelector(s);let M='q',V='region',sortK=null,sortD=-1,showAll=false;

function agg(rows,key){const m=new Map();rows.forEach(r=>{const k=key(r);const o=m.get(k)||{k,t:0,a:0,p:0};o.t+=r.t;o.a+=r.a;o.p+=r.p;m.set(k,o)});return[...m.values()]}

function kpis(){const R=shopRows(),t=R.reduce((x,r)=>x+r.t,0),a=R.reduce((x,r)=>x+r.a,0),p=R.reduce((x,r)=>x+r.p,0),rr=RR(a);

const c=(l,v,s,h,pb)=>`<div class="kpi ${h?'hero':''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div>${pb!=null?`<div class="pb"><i style="width:${Math.min(100,pb*100)}%"></i></div>`:''}</div>`;
$('#kpis').innerHTML=c('Target',big(t),u)+c('Actual',big(a),`เทียบ ต.ค. 1–22: <span class="${mom>=0?'up':'dn'}">${isFinite(mom)?(mom>=0?'+':'')+pct(mom):'-'}</span>`)+c('Runrate',big(rr),`คาดการณ์สิ้นเดือน (${D.elapsed}/${D.days} วัน)`)+c('%Ach',pct(t?a/t:NaN),`ขาดอีก ${big(Math.max(0,t-a))}`,1,t?a/t:0)+c('%Ach RR',pct(t?rr/t:NaN),rr>=t?'คาดว่าถึง Target':`ช่องว่างคาดการณ์ ${big(t-rr)}`,1,t?rr/t:0)}
function mainTable(){let rows,head=['Target','Actual','Runrate','%Ach','%Ach RR'],first='';const q=($('#q').value||'').toLowerCase();$('#q').style.display=(V==='shop'||V==='staff')?'':'none';
